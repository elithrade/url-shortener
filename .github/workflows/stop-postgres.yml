# Stop the Postgres server every night: it costs about AU$0.04 an hour while running and only its
# storage while stopped. deploy.yml starts it again before migrating. Azure restarts a server that
# has been stopped for 7 days, so the nightly run also catches that.
name: stop postgres

on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC: about midnight to 1 am in Sydney
  workflow_dispatch: # run by hand from the Actions tab

# shares deploy.yml's group, so it never stops the database in the middle of a deploy
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC sign-in, same identity as deploy.yml

env:
  RG: rg-shortener

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Stop Postgres
        run: |
          server=$(az postgres flexible-server list -g "$RG" --query "[0].name" -o tsv)
          if [ -z "$server" ]; then
            echo "postgres: none (deleted by delete-postgres.yml)"
            exit 0
          fi
          state=$(az postgres flexible-server show -g "$RG" -n "$server" --query state -o tsv)
          echo "postgres: $state"
          if [ "$state" = "Ready" ]; then
            az postgres flexible-server stop -g "$RG" -n "$server" -o none
            echo "postgres: stopped"
          fi
