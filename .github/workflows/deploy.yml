# Build and deploy every push to main once CI has passed (stage 1 of the Azure plan; manual steps in infra/README.md).
# Azure sign-in is OIDC: no stored Azure credential, see LESSONS.md section 26.
name: deploy

on:
  # deploy only code that CI (ci.yml) has tested: runs after every finished CI run, checked below
  workflow_run:
    workflows: [Url shortener web app CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # run by hand from the Actions tab (deploys the latest main)

# one deploy at a time; a newer push waits instead of cancelling a half-done migration
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # a workflow_run runs on main's latest commit, which may be newer than the one CI tested
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha || github.sha }}
  RG: rg-shortener

jobs:
  build:
    # CI also runs for pull requests, and a fork can name its branch main: deploy only a
    # successful CI run of a push to this repository
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the run's own GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Postgres runs only when wanted (start-postgres.yml); the nightly stop and delete-postgres.yml
      # turn it off. A push never starts or creates it: with the server off, the new image is
      # deployed without the migration and the smoke test, and start-postgres.yml runs both later.
      - name: Check Postgres
        id: postgres
        run: |
          server=$(az postgres flexible-server list -g "$RG" --query "[0].name" -o tsv)
          if [ -z "$server" ]; then
            echo "postgres: none"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for _ in $(seq 40); do
            state=$(az postgres flexible-server show -g "$RG" -n "$server" --query state -o tsv)
            echo "postgres: $state"
            case "$state" in
              Ready) echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              Starting | Stopping | Updating | Provisioning | Restarting) sleep 15 ;; # settling
              # Stopped, and states that won't settle soon (Dropping after a failed create,
              # Disabled, anything new): treat as off, so the push still deploys the image
              *) echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done
          echo "postgres: no settled state after 10 minutes"
          exit 1

      - name: Postgres is off
        if: steps.postgres.outputs.ready != 'true'
        run: echo "::notice::Postgres is not running (see Check Postgres), so this deploy skips the migration and the smoke test. Run start-postgres.yml before using the app."

      # the schema first: the new code must never meet an old schema. A failure stops here,
      # and the current revision keeps serving.
      - name: Migrate
        if: steps.postgres.outputs.ready == 'true'
        run: |
          az containerapp job update -n shortener-migrate -g "$RG" --image "$IMAGE" -o none
          .github/scripts/migrate.sh

      # Bicep stays the source of truth: the same template as the manual deploy, with the new image.
      # DEPLOY_POSTGRES is unset, so the template leaves the Postgres server alone.
      - name: Deploy
        env:
          SHORTENER_IMAGE: ${{ env.IMAGE }}
          SHORTENER_ALLOWED_IP: ${{ secrets.SHORTENER_ALLOWED_IP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          az deployment group create -g "$RG" -n "deploy-${{ github.run_number }}" \
            -f infra/main.bicep -p infra/main.bicepparam -o none

      # without Postgres, /health/ready fails and the ingress sends the app no traffic, so the
      # check runs only with the server up
      - name: Smoke test
        if: steps.postgres.outputs.ready == 'true'
        run: .github/scripts/smoke-test.sh
