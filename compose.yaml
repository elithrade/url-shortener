# Local run: Postgres, Redis (a cache), a one-shot schema step, then the app.
# Needs POSTGRES_PASSWORD in the environment or in an untracked .env file.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shortener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shortener"]
      interval: 2s
      timeout: 3s
      retries: 30

  # a cache, not a store: capped memory, least recently used keys evicted when full, and no
  # persistence (a restart only costs misses)
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "100mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ["migrate"]
    restart: "no"
    environment: &app-env
      Storage: Postgres
      ConnectionStrings__Shortener: Host=postgres;Database=shortener;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    # SIGTERM to SIGKILL; must stay above the app's ShutdownTimeout (12 s)
    stop_grace_period: 15s
    environment:
      <<: *app-env
      # local stack only: Development allows an http BaseUrl (milestone 8 brings https)
      ASPNETCORE_ENVIRONMENT: Development
      Shortener__BaseUrl: http://localhost:8080
      # containers log one JSON object per line, even in Development
      Logging__Console__FormatterName: json
      ConnectionStrings__Redis: redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
